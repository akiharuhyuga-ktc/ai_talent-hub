AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SAM Template for bizport-talenthub-ai (Bedrock streaming proxy with bizport JWT auth)

# Globals は他の関数を増やしたとき汚染源になるので Runtime / Environment のみ。
# Timeout / MemorySize は関数単位で個別指定する。
Globals:
  Function:
    Runtime: nodejs24.x
    Environment:
      Variables:
        Stage: !Ref Stage
        BizportApiBaseUrl: !Ref BizportApiBaseUrl
        BedrockModelId: !Ref BedrockModelId

Parameters:
  Env:
    Type: String
  Stage:
    Type: String
  Sid:
    Type: String
    Default: bizport
  ReleaseVersion:
    Type: String
  ShaShort:
    Type: String
  BizportApiBaseUrl:
    Type: String
    Description: bizport API のベース URL (`/api/v1/auth/me` を叩く先)
  BedrockModelId:
    Type: String
    Description: 使用する Bedrock モデルの ID (ap-northeast-1 は Global cross-region inference のみ対応のため `global.anthropic.claude-sonnet-4-6` 等の inference profile ID を指定する)
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: bizport VPC ID。Lambda を bizport の VPC 内に配置して bizport NAT Gateway 経由で `/api/v1/auth/me` を叩く構成。
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: bizport の private application subnet IDs (複数 AZ)。Lambda はここに ENI を作成する。
  CloudFrontDistributionId:
    Type: String
    Description: bizport CloudFront distribution ID (terraform 管理)。OAC が Function URL を SigV4 で叩くための resource-based policy で参照する。

Resources:
  TalenthubAiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${Env}-${Sid}-talenthub-ai-lambda-sg"
      GroupDescription: !Sub "${Env}-${Sid}-talenthub-ai Lambda (egress only; routes outbound traffic via bizport NAT Gateway)"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: allow all egress via bizport NAT Gateway (to bizport CloudFront and Bedrock)
      Tags:
        - Key: SID
          Value: !Ref Sid
        - Key: Environment
          Value: !Ref Env

  TalenthubAiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app/functions/talenthubAiProxy.handler
      FunctionName: !Sub "${Env}-${Sid}-talenthub-ai-function"
      Description: !Sub "Version:${ReleaseVersion}-${ShaShort}"
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/${Env}-${Sid}-talenthub-ai-lambda-execution-role"
      Timeout: 120  # AI 推論ユースケース。900 は slow-loris DoS 面が広いので圧縮 (max_tokens 上限 + Lambda timeout で stuck 抑制)
      MemorySize: 1024  # CPU は memory 比例。SDK 起動 / SSE proxy / fetch のベース性能向上目的
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !GetAtt TalenthubAiSecurityGroup.GroupId
      FunctionUrlConfig:
        AuthType: AWS_IAM
        InvokeMode: RESPONSE_STREAM

  # CloudFront OAC (SigV4) が Function URL を呼び出すための resource-based policy。
  # AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-lambda.html
  # OAC for Lambda Function URL では `lambda:InvokeFunctionUrl` のみで成立する (`lambda:InvokeFunction` 側は不要なので削除)。
  TalenthubAiFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TalenthubAiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}"

Outputs:
  TalenthubAiFunctionUrl:
    Description: "Lambda Function URL (set this hostname into terraform `pack.cloudfront.frontend.origin.lambda.domain_name`)"
    Value: !GetAtt TalenthubAiFunctionUrl.FunctionUrl
  TalenthubAiFunctionArn:
    Description: "Lambda Function ARN"
    Value: !GetAtt TalenthubAiFunction.Arn
